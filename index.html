<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestione Zone</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4a90e2">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #f0f2f5; }
        iframe { width: 100%; height: 100%; border: none; display: block; }
    </style>
</head>
<body>
    <iframe id="gas-frame" src="INSERISCI_QUI_IL_TUO_LINK_GOOGLE_SCRIPT" allow="microphone"></iframe>

    <script>
        // Registriamo il Service Worker per sbloccare l'installazione su Android
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
            .then(() => console.log('Service Worker registrato con successo!'))
            .catch(err => console.error('Errore Service Worker:', err));
        }
    </script>
</body>
</html>
